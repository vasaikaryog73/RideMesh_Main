spring.application.name=ApiGateway
server.port=8089
deploy.env=production

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route public auth requests to UserService
spring.cloud.gateway.routes[0].id=user-service-auth
spring.cloud.gateway.routes[0].uri=lb://UserService
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Route onboard and profile rider requests to UserService
spring.cloud.gateway.routes[1].id=user-service-rider
spring.cloud.gateway.routes[1].uri=lb://UserService
spring.cloud.gateway.routes[1].predicates[0]=Path=/rider/onboard,/rider/getMyProfile,/rider/rateDriver/**

# Route onboard and profile driver requests to UserService
spring.cloud.gateway.routes[2].id=user-service-driver
spring.cloud.gateway.routes[2].uri=lb://UserService
spring.cloud.gateway.routes[2].predicates[0]=Path=/driver/onboard,/driver/getMyProfile,/driver/rateRider/**,/driver/toggle-availability

# Route ride request, cancel, and getMyRides rider operations to RideService
spring.cloud.gateway.routes[3].id=ride-service-rider
spring.cloud.gateway.routes[3].uri=lb://RideService
spring.cloud.gateway.routes[3].predicates[0]=Path=/rider/requestRide,/rider/cancelRide/**,/rider/cancelRequest/**,/rider/getMyRides,/rider/completeRide/**,/rider/activeRide,/rider/confirmCashPaid/**,/rider/finalizeUpi/**,/rider/rateRide/**

# Route accept, start, end, cancel, getMyRides driver operations to RideService
spring.cloud.gateway.routes[4].id=ride-service-driver
spring.cloud.gateway.routes[4].uri=lb://RideService
spring.cloud.gateway.routes[4].predicates[0]=Path=/driver/acceptRide/**,/driver/startRide/**,/driver/endRide/**,/driver/cancelRide/**,/driver/getMyRides,/driver/pendingRides,/driver/completeRide/**,/driver/activeRide,/driver/declineRide/**,/driver/confirmCashReceived/**

# Route wallet operations to WalletService
spring.cloud.gateway.routes[5].id=wallet-service
spring.cloud.gateway.routes[5].uri=lb://WalletService
spring.cloud.gateway.routes[5].predicates[0]=Path=/wallet/**,/webhooks/razorpay

# Route notify operations (test controllers) to NotifyService
spring.cloud.gateway.routes[6].id=notify-service
spring.cloud.gateway.routes[6].uri=lb://NotifyService
spring.cloud.gateway.routes[6].predicates[0]=Path=/test-notification/**

# Route booking operations to RideService
spring.cloud.gateway.routes[7].id=ride-service-bookings
spring.cloud.gateway.routes[7].uri=lb://RideService
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/bookings/**

