spring.application.name=ThymeleafUI
server.port=8085
deploy.env=production

# ApiGateway Base URL
gateway.base-url=http://localhost:8089

# Thymeleaf caching properties
spring.thymeleaf.cache=false

# Spring Boot Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Google OAuth2 Credentials
google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8085/login/oauth2/code/google}
