<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Admin Terminal</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            background-color: var(--color-bg, #ffffff);
            color: var(--color-text, #0f172a);
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .glow-btn:hover {
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }
        /* Softer background glows */
        .absolute.rounded-full.filter.blur-3xl {
            background-color: #f3e8ff !important; /* purple-100: extremely soft light purple! */
            opacity: 0.25 !important;
        }
    </style>
    <!-- Include Theme Styles -->
    <th:block th:replace="~{fragments/navigation :: themeStyles}"></th:block>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden relative">

    <!-- Background Gradients -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full filter blur-3xl opacity-5 animate-pulse"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500 rounded-full filter blur-3xl opacity-5 animate-pulse"></div>

    <!-- Header Navigation -->
    <nav class="glass-card py-4 px-8 flex justify-between items-center border-b border-slate-200 relative z-20">
        <a th:href="@{/}" class="flex items-center space-x-3 brand-link">
            <img src="https://res.cloudinary.com/dvb5mesnd/image/upload/v1792821669/RideMeshIcon-modified_hwnpel.png" alt="RideMesh Logo" class="w-8 h-8 rounded-lg object-contain shadow-sm" />
            <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
                RideMesh
            </span>
        </a>
        <div class="flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-900 dark:hover:bg-gray-800 flex items-center justify-center transition border border-gray-200 dark:border-gray-800 focus:outline-none" title="Toggle Theme">
                <i class="fa-solid fa-sun text-amber-500" id="theme-toggle-icon"></i>
            </button>
            <span class="text-xs text-white font-bold uppercase tracking-wider px-3 py-1.5 rounded-lg bg-white/20 border border-white/30">Admin Portal</span>
        </div>
    </nav>

    <!-- Admin Login Main Frame -->
    <main class="flex-grow flex items-center justify-center p-6 relative z-10">
        <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-purple-100 border border-purple-200 rounded-full flex items-center justify-center mx-auto mb-4 text-purple-600 text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">System Admin Login</h1>
                <p class="text-slate-500 text-xs">Enter credentials to gain access to administrative operations.</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${error != null}" class="p-3.5 rounded-lg bg-rose-100 border border-rose-300 text-rose-800 text-xs text-center">
                <span th:text="${error}">Error details</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/admin-login}" method="POST" class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Administrator Email</label>
                    <input type="email" name="email" required placeholder="Enter administrator email"
                           class="w-full bg-white border border-slate-200 focus:border-purple-500 rounded-lg p-3 text-slate-900 text-sm focus:outline-none transition"
                           autocomplete="off">
                </div>

                <div>
                    <label class="text-xs text-slate-500 block mb-1">Security Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full bg-white border border-slate-200 focus:border-purple-500 rounded-lg p-3 text-slate-900 text-sm focus:outline-none transition">
                </div>

                <button type="submit"
                        class="w-full py-3.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm transition shadow-lg glow-btn">
                    Authenticate Session
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 relative z-20">
        &copy; 2026 RideMesh Systems Inc. All rights reserved.
    </footer>

    <!-- Include Theme Scripts -->
    <th:block th:replace="~{fragments/navigation :: themeScripts}"></th:block>
</body>
</html>
