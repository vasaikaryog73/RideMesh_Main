<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Profile</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar fragment injection -->
    <div th:replace="~{fragments/navigation :: sidebar('profile', ${currentUser})}"></div>

    <div class="flex-grow flex flex-col min-h-screen">
        <!-- Top Navbar fragment injection -->
        <header th:replace="~{fragments/navigation :: navbar(${currentUser})}"></header>

        <!-- Profile Settings View -->
        <main class="flex-grow p-8 flex items-start justify-center relative overflow-hidden">
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full filter blur-3xl opacity-5 animate-pulse"></div>
            
            <div class="glass-card w-full max-w-2xl p-8 rounded-2xl shadow-2xl relative z-10 space-y-6">
                <!-- User Profile Header -->
                <div class="flex items-center space-x-6 pb-6 border-b border-slate-200">
                    <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-bold text-white text-3xl shadow-xl border border-purple-400/20"
                         th:text="${#strings.isEmpty(currentUser.name) ? 'U' : #strings.substring(currentUser.name, 0, 1).toUpperCase()}">
                        U
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900" th:text="${currentUser.name}">John Doe</h1>
                        <span class="text-sm text-purple-600 font-medium capitalize" th:text="${#strings.listJoin(currentUser.roles, ', ')}">RIDER</span>
                    </div>
                </div>

                <!-- Account Information Details -->
                <div class="space-y-4">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Account Specifications</h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <span class="text-xs text-slate-400 block mb-1">User ID</span>
                            <span class="text-sm font-semibold text-slate-900" th:text="${currentUser.id}">123</span>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <span class="text-xs text-slate-400 block mb-1">Email Address</span>
                            <span class="text-sm font-semibold text-slate-900" th:text="${currentUser.email}">user@domain.com</span>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <span class="text-xs text-slate-400 block mb-1">Verification Status</span>
                            <span class="text-sm font-semibold text-emerald-600 flex items-center space-x-2" th:if="${currentUser.emailVerified}">
                                <i class="fa-solid fa-circle-check text-emerald-500"></i> <span>Verified Account</span>
                            </span>
                            <span class="text-sm font-semibold text-amber-600 flex items-center space-x-2" th:unless="${currentUser.emailVerified}">
                                <i class="fa-solid fa-circle-exclamation text-amber-500"></i> <span>Unverified Account</span>
                            </span>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <span class="text-xs text-slate-400 block mb-1">Status Type</span>
                            <span class="text-sm font-semibold text-slate-900">Active</span>
                        </div>
                    </div>
                </div>

                <div class="pt-6 text-center">
                    <a th:href="@{/}" class="inline-block px-6 py-2.5 rounded-lg bg-white hover:bg-slate-50 border border-slate-200 text-sm font-semibold text-slate-700 transition shadow-sm">
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </main>

        <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200">
            &copy; 2026 RideMesh Systems Inc. All rights reserved.
        </footer>
    </div>

    <!-- Script triggers -->
    <div th:replace="~{fragments/navigation :: navigationScripts}"></div>
</body>
</html>
