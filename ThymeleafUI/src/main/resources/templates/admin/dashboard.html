<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Admin Terminal</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar fragment injection -->
    <div th:replace="~{fragments/navigation :: sidebar('admin-dashboard', ${currentUser})}"></div>

    <div class="flex-grow flex flex-col min-h-screen">
        <!-- Top Navbar fragment injection -->
        <header th:replace="~{fragments/navigation :: navbar(${currentUser})}"></header>

        <main class="flex-grow p-8 space-y-6 relative overflow-hidden">
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full filter blur-3xl opacity-10 animate-pulse"></div>

            <!-- Page Title -->
            <div class="relative z-10">
                <h2 class="text-2xl font-bold text-white">System Admin Terminal</h2>
                <p class="text-xs text-gray-400">Perform systems operations, manage users, and onboard drivers.</p>
            </div>

            <!-- Alerts for actions -->
            <div th:if="${successMessage != null}" class="p-4 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 text-sm shadow-lg relative z-10">
                <span th:text="${successMessage}">Success description</span>
            </div>
            <div th:if="${errorMessage != null}" class="p-4 rounded-xl bg-rose-950/50 border border-rose-500/30 text-rose-400 text-sm shadow-lg relative z-10">
                <span th:text="${errorMessage}">Error description</span>
            </div>

            <!-- Onboarding Panel Grid -->
            <div class="grid grid-cols-1 gap-8 relative z-10">
                <!-- Driver Onboarding Form -->
                <div class="glass-card p-6 rounded-2xl shadow-xl space-y-4">
                    <h3 class="text-lg font-bold text-white mb-2">Onboard Driver</h3>
                    <p class="text-gray-400 text-xs mb-6">Convert any existing rider account into an active driver account by assigning their vehicle ID.</p>

                    <form th:action="@{/admin/onboardDriver}" method="POST" onsubmit="return showNotImplementedModal(event)" class="space-y-4 max-w-xl">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Rider User ID</label>
                            <input type="number" name="userId" required placeholder="e.g. 5"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-purple-500 rounded-lg p-3 text-white text-sm focus:outline-none transition">
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Vehicle Numeric ID (e.g. 12345)</label>
                            <input type="number" name="vehicleId" required placeholder="e.g. 12345"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-purple-500 rounded-lg p-3 text-white text-sm focus:outline-none transition">
                        </div>

                        <button type="submit"
                                class="py-3 px-6 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm transition shadow-lg">
                            Register & Onboard Driver
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-950">
            &copy; 2026 RideMesh Systems Inc. All rights reserved.
        </footer>
    </div>

    <!-- Script triggers -->
    <div th:replace="~{fragments/navigation :: navigationScripts}"></div>
</body>
</html>
