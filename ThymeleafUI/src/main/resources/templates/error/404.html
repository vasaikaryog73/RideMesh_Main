<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Page Not Found</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--color-bg, #ffffff);
            color: var(--color-text, #0f172a);
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        }
        .floating-car {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
    <!-- Include Theme Styles -->
    <th:block th:replace="~{fragments/navigation :: themeStyles}"></th:block>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden relative">

    <!-- Background Gradients -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600 rounded-full filter blur-3xl opacity-10"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-purple-600 rounded-full filter blur-3xl opacity-10"></div>

    <!-- Header Navbar -->
    <nav class="glass-card py-4 px-8 flex justify-between items-center border-b border-gray-950 relative z-20">
        <div class="flex items-center space-x-3">
            <img src="https://res.cloudinary.com/dvb5mesnd/image/upload/v1792821669/RideMeshIcon-modified_hwnpel.png" alt="RideMesh Logo" class="w-8 h-8 rounded-lg object-contain shadow-sm" />
            <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                RideMesh
            </span>
        </div>
        <div class="flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-900 dark:hover:bg-gray-800 flex items-center justify-center transition border border-gray-200 dark:border-gray-800 focus:outline-none" title="Toggle Theme">
                <i class="fa-solid fa-sun text-amber-500" id="theme-toggle-icon"></i>
            </button>
            <a th:href="@{/}" class="text-xs text-gray-400 hover:text-white transition uppercase font-bold tracking-wider">Home</a>
        </div>
    </nav>

    <!-- Error Content -->
    <main class="flex-grow flex items-center justify-center p-6 relative z-10">
        <div class="glass-card w-full max-w-lg p-10 rounded-2xl shadow-2xl text-center space-y-8">
            <!-- Floating Car Icon -->
            <div class="floating-car text-6xl select-none">
                🚗💨
            </div>

            <!-- 404 Title -->
            <div class="space-y-2">
                <h1 class="text-8xl font-black bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent tracking-tight">
                    404
                </h1>
                <h2 class="text-xl font-bold text-white">Oops! Lost in Route</h2>
                <p class="text-gray-400 text-xs max-w-sm mx-auto leading-relaxed">
                    The destination page you are trying to reach doesn't exist, was renamed, or has been temporarily removed.
                </p>
            </div>

            <!-- Redirect Link Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a th:href="@{/dashboard}"
                   class="w-44 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow-lg glow-btn">
                    Go to Dashboard
                </a>
                <a th:href="@{/}"
                   class="w-44 py-3 rounded-lg bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 font-semibold text-xs transition">
                    Return to Homepage
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-950 relative z-20">
        &copy; 2026 RideMesh Systems Inc. All rights reserved.
    </footer>

    <!-- Include Theme Scripts -->
    <th:block th:replace="~{fragments/navigation :: themeScripts}"></th:block>
</body>
</html>
