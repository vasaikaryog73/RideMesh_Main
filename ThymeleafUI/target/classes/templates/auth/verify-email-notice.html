<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Verification Required</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .glow-btn:hover:not(:disabled) {
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }
        /* Softer background glows */
        .absolute.rounded-full.filter.blur-3xl {
            background-color: #f3e8ff !important; /* purple-100: extremely soft light purple! */
            opacity: 0.25 !important;
        }
    </style>
    <!-- Include Theme Styles -->
    <th:block th:replace="~{fragments/navigation :: themeStyles}"></th:block>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="glass-card py-4 px-8 flex justify-between items-center border-b border-slate-200">
        <a th:href="@{/}" class="flex items-center space-x-3 brand-link">
            <img src="https://res.cloudinary.com/dvb5mesnd/image/upload/v1788200216/RideMeshIcon-main_z7q9bk.png" alt="RideMesh Logo" class="w-8 h-8 rounded-lg object-contain shadow-sm" />
            <span class="text-xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
                RideMesh
            </span>
        </a>
        <div class="flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-900 dark:hover:bg-gray-800 flex items-center justify-center transition border border-gray-200 dark:border-gray-800 focus:outline-none" title="Toggle Theme">
                <i class="fa-solid fa-sun text-amber-500" id="theme-toggle-icon"></i>
            </button>
            <a th:href="@{/logout}" class="text-rose-600 hover:text-rose-500 text-sm font-semibold transition">Log Out</a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
        <!-- Background Gradients -->
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full filter blur-3xl opacity-5 animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500 rounded-full filter blur-3xl opacity-5 animate-pulse"></div>

        <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl relative z-10 text-center">
            <div class="w-16 h-16 bg-amber-100 border border-amber-300 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 mb-2">Verify Your Account</h1>
            <p class="text-slate-500 text-sm mb-6">
                Hi <span class="text-purple-600 font-semibold" th:text="${currentUser.name}">User</span>, you need to verify your email address before you can access the application.
            </p>

            <!-- Dynamic Alert Box -->
            <div id="status-alert" class="hidden text-sm p-4 rounded-lg mb-6 text-center"></div>

            <div class="space-y-4">
                <button id="send-btn" onclick="sendVerificationLink()"
                        class="w-full py-3 px-4 rounded-lg bg-purple-600 hover:bg-purple-500 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-semibold transition glow-btn text-sm">
                    Send Verification Link
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200">
        &copy; 2026 RideMesh Systems Inc. All rights reserved.
    </footer>

    <script th:inline="javascript">
        let countdownTimer;

        function sendVerificationLink() {
            const btn = document.getElementById('send-btn');
            const alertBox = document.getElementById('status-alert');

            // Disable button immediately
            btn.disabled = true;
            btn.innerText = 'Sending...';

            // Send POST request
            fetch('/verify-email-notice/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    alertBox.className = "bg-emerald-100 border border-emerald-300 text-emerald-800 text-sm p-4 rounded-lg mb-6 text-center block";
                    alertBox.innerText = "Verification link sent! Check your inbox or spam folder.";
                    startTimer(120);
                } else {
                    throw new Error();
                }
            })
            .catch(() => {
                alertBox.className = "bg-rose-100 border border-rose-300 text-rose-800 text-sm p-4 rounded-lg mb-6 text-center block";
                alertBox.innerText = "Failed to send link. Please try again later.";
                btn.disabled = false;
                btn.innerText = 'Send Verification Link';
            });
        }

        function startTimer(duration) {
            const btn = document.getElementById('send-btn');
            let timeLeft = duration;

            clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                timeLeft--;
                btn.innerText = `Resend in ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    btn.disabled = false;
                    btn.innerText = 'Resend verification link';
                }
            }, 1000);
        }
    </script>
    <!-- Include Theme Scripts -->
    <th:block th:replace="~{fragments/navigation :: themeScripts}"></th:block>
</body>
</html>
