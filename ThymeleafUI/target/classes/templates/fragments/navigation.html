<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar(activePage, user)" 
         id="sidebar-menu" 
         class="w-64 glass-card border-r border-gray-950 flex flex-col justify-between shrink-0 min-h-screen text-gray-300 fixed lg:static inset-y-0 left-0 z-50 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        
        <!-- Include Theme Styles -->
        <th:block th:replace="~{fragments/navigation :: themeStyles}"></th:block>


        <div>
            <!-- Branding Logo -->
            <div class="p-6 border-b border-gray-950 flex items-center justify-between">
                <a th:href="@{/}" class="flex items-center space-x-3 brand-link">
                    <img src="https://res.cloudinary.com/dvb5mesnd/image/upload/v1788200216/RideMeshIcon-main_z7q9bk.png" alt="RideMesh Logo" class="w-8 h-8 rounded-lg object-contain shadow-sm" />
                    <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                        RideMesh
                    </span>
                </a>
                <!-- Close button for mobile menu -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-500 hover:text-white focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Navigation Menu Options -->
            <nav class="p-4 space-y-2">
                <!-- Rider Options -->
                <div th:if="${user.roles.contains('RIDER')}" class="space-y-1">
                    <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-2">Rider Console</span>
                    <a th:href="@{/rider/dashboard}" 
                       th:class="${activePage == 'book' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-map-location-dot"></i></span> <span>Book a Ride</span>
                    </a>
                    <a th:href="@{/rider/wallet}" 
                       th:class="${activePage == 'wallet' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-credit-card"></i></span> <span>Wallet &amp; Payments</span>
                    </a>
                    <a th:href="@{/rider/history}" 
                       th:class="${activePage == 'history' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-clock-rotate-left"></i></span> <span>Ride History</span>
                    </a>
                    <a th:href="@{/rider/become-driver}" 
                       th:class="${activePage == 'become-driver' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-id-card"></i></span> <span>Become a Driver</span>
                    </a>
                </div>

                <!-- Driver Options -->
                <div th:if="${currentUser.roles.contains('DRIVER')}" class="space-y-1">
                    <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-2">Driver Console</span>
                    <a th:href="@{/driver/dashboard}" 
                       th:class="${activePage == 'terminal' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-purple-600/20 text-purple-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-car-side"></i></span> <span>Driver Terminal</span>
                    </a>
                    <a th:href="@{/driver/history}" 
                       th:class="${activePage == 'driver-history' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-purple-600/20 text-purple-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-clock-rotate-left"></i></span> <span>Completed Rides</span>
                    </a>
                </div>

                <!-- Admin Options -->
                <div th:if="${currentUser.roles.contains('ADMIN')}" class="space-y-1">
                    <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-2">Admin Console</span>
                    <a th:href="@{/admin/dashboard}" 
                       th:class="${activePage == 'admin-dashboard' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-purple-600/20 text-purple-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-screwdriver-wrench"></i></span> <span>Onboard Driver</span>
                    </a>
                    <a th:href="@{/admin/applications}" 
                       th:class="${activePage == 'applications' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-purple-600/20 text-purple-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-file-invoice"></i></span> <span>Driver Applications</span>
                    </a>
                    <a th:href="@{/admin/drivers}" 
                       th:class="${activePage == 'drivers' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-purple-600/20 text-purple-400 font-medium transition' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition'}">
                        <span class="w-5 text-center"><i class="fa-solid fa-users-gear"></i></span> <span>Drivers List</span>
                    </a>
                </div>
            </nav>
        </div>

        <!-- Sidebar Footer Action Panel -->
        <div class="p-4 border-t border-gray-950 space-y-2">
            <!-- Sidebar Theme Toggle -->
            <button onclick="toggleTheme()" 
                    class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition w-full text-left">
                <span class="w-5 text-center"><i class="fa-solid fa-sun text-amber-500" id="theme-toggle-icon"></i></span> <span>Toggle Theme</span>
            </button>
            <a th:href="@{/profile}" 
               th:class="${activePage == 'profile' ? 'flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium transition w-full text-left' : 'flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-900/60 hover:text-white transition w-full text-left'}">
                <span class="w-5 text-center"><i class="fa-solid fa-user"></i></span> <span>Profile</span>
            </a>
            <button onclick="confirmLogout()" 
                    class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-rose-950/20 hover:text-rose-400 transition w-full text-left">
                <span class="w-5 text-center"><i class="fa-solid fa-right-from-bracket"></i></span> <span>Log Out</span>
            </button>
        </div>
    </div>


    <!-- Top Navbar Fragment -->
    <header th:fragment="navbar(user)" class="h-16 glass-card border-b border-gray-950 flex items-center justify-between px-8 text-gray-300 relative z-40 shrink-0">
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <div class="flex items-center space-x-3">
            <!-- Hamburger Button (Mobile/Tab only) -->
            <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-gray-400 hover:text-white focus:outline-none transition">
                <!-- Hamburger 3 lines -->
                <svg id="hamburger-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <!-- Cross icon -->
                <svg id="cross-icon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Breadcrumbs / Active Mode description -->
            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400" 
                  th:text="${user.roles.contains('ADMIN') ? 'Admin Dashboard' : (user.roles.contains('DRIVER') ? 'Driver Dashboard' : 'Rider Dashboard')}">
                Dashboard
            </span>
        </div>

        <!-- Right Side Avatar Profile Menu (Hidden on Mobile) -->
        <div class="hidden lg:flex items-center space-x-4">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" 
                    class="w-8 h-8 rounded-lg bg-gray-950/20 hover:bg-gray-950/40 flex items-center justify-center transition border border-gray-800 focus:outline-none" 
                    title="Toggle Light/Dark Theme">
                <i class="fa-solid fa-sun text-amber-500" id="theme-toggle-icon"></i>
            </button>

            <span class="text-sm font-medium text-gray-400" th:text="${user.name}">John Doe</span>

            <!-- Circle Profile Initials Avatar -->
            <div class="relative">
                <button onclick="toggleAvatarDropdown()" 
                        class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 border border-indigo-400/20 flex items-center justify-center font-bold text-white shadow-lg focus:outline-none hover:scale-105 transition-transform"
                        th:text="${#strings.isEmpty(user.name) ? 'U' : #strings.substring(user.name, 0, 1).toUpperCase()}">
                    U
                </button>

                <!-- Dropdown Menu -->
                <div id="avatar-dropdown" class="hidden absolute right-0 mt-2 w-48 rounded-xl bg-gray-900 border border-gray-800 shadow-2xl p-2 z-50 text-sm">
                    <a th:href="@{/profile}" class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-gray-800 hover:text-white transition">
                        <span class="w-5 text-center"><i class="fa-solid fa-user"></i></span> <span>View Profile</span>
                    </a>
                    <button onclick="confirmLogout()" class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-rose-950/30 hover:text-rose-400 transition w-full text-left">
                        <span class="w-5 text-center"><i class="fa-solid fa-right-from-bracket"></i></span> <span>Log Out</span>
                    </button>
                </div>
            </div>
        </div>
    </header>


    <!-- Script Actions Fragment -->
    <div th:fragment="navigationScripts">
        <!-- Global Logout Confirmation Dialog -->
        <div id="logout-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-all duration-300">
            <div class="glass-card w-full max-w-sm rounded-2xl p-6 md:p-8 shadow-2xl border border-gray-200 dark:border-gray-800 text-center relative" onclick="event.stopPropagation()">
                <!-- Close button -->
                <button onclick="closeLogoutModal()" type="button" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <p class="text-base font-semibold text-gray-900 dark:text-white mt-2 mb-6">
                    Are you sure you want to log out?
                </p>

                <!-- Action Buttons: Cancel and OK -->
                <div class="flex items-center justify-center space-x-3">
                    <button onclick="closeLogoutModal()" type="button" class="w-1/2 py-2.5 px-4 rounded-xl border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 font-semibold text-sm transition">
                        Cancel
                    </button>
                    <button onclick="proceedLogout()" type="button" class="w-1/2 py-2.5 px-4 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold text-sm transition shadow-lg shadow-orange-500/25">
                        OK
                    </button>
                </div>
            </div>
        </div>

        <script>
            function showNotImplementedModal(e) {
                if (e && typeof e.preventDefault === 'function') {
                    e.preventDefault();
                    e.stopPropagation();
                }
                alert("Sorry, this feature is yet to be implemented");
                return false;
            }

            function confirmLogout() {
                const modal = document.getElementById('logout-modal');
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                } else if (confirm("Are you sure you want to log out?")) {
                    window.location.href = "/logout";
                }
            }

            function closeLogoutModal() {
                const modal = document.getElementById('logout-modal');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            }

            function proceedLogout() {
                window.location.href = "/logout";
            }

            // Close modal on backdrop click and Escape key
            document.addEventListener('DOMContentLoaded', function() {
                const modal = document.getElementById('logout-modal');
                if (modal) {
                    modal.addEventListener('click', function(e) {
                        if (e.target === modal) {
                            closeLogoutModal();
                        }
                    });
                }
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        closeLogoutModal();
                    }
                });
            });

            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar-menu');
                const hamburgerIcon = document.getElementById('hamburger-icon');
                const crossIcon = document.getElementById('cross-icon');
                
                sidebar.classList.toggle('-translate-x-full');
                
                if (sidebar.classList.contains('-translate-x-full')) {
                    hamburgerIcon.classList.remove('hidden');
                    crossIcon.classList.add('hidden');
                } else {
                    hamburgerIcon.classList.add('hidden');
                    crossIcon.classList.remove('hidden');
                }
            }

            function toggleAvatarDropdown() {
                const dropdown = document.getElementById('avatar-dropdown');
                dropdown.classList.toggle('hidden');
            }

            // Close dropdown when clicking outside
            window.addEventListener('click', function(e) {
                const dropdown = document.getElementById('avatar-dropdown');
                const trigger = dropdown ? dropdown.previousElementSibling : null;
                if (dropdown && !dropdown.contains(e.target) && !trigger.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        </script>
        <!-- Include Theme Scripts -->
        <th:block th:replace="~{fragments/navigation :: themeScripts}"></th:block>
    </div>

    <!-- Theme Styles Fragment -->
    <th:block th:fragment="themeStyles">
        <link rel="icon" type="image/png" href="https://res.cloudinary.com/dvb5mesnd/image/upload/v1788200216/RideMeshIcon-main_z7q9bk.png" />
        <style>
            :root {
                --color-bg: #ffffff; /* pure solid white background */
                --color-text: #0f172a; /* deep dark slate text */
                --color-primary: #f97316; /* orange-500 */
                --color-primary-hover: #ea580c; /* orange-600 */
                --color-card-bg: #ffffff;
                --color-card-border: #e2e8f0; /* slate-200 */
                --color-input-bg: #ffffff;
                --color-input-border: #cbd5e1; /* slate-300 */
                --color-muted: #475569; /* slate-600 */
                --color-border: #e2e8f0;
                --color-shadow: rgba(0, 0, 0, 0.05);
            }

            :root.dark {
                --color-bg: #000000; /* pure solid black background */
                --color-text: #f3f4f6; /* light grey text */
                --color-primary: #f97316; /* orange-500 */
                --color-primary-hover: #ea580c; /* orange-600 */
                --color-card-bg: #121212; /* solid dark gray-black card */
                --color-card-border: #27272a; /* zinc-800 */
                --color-input-bg: #18181b; /* zinc-900 */
                --color-input-border: #3f3f46; /* zinc-700 */
                --color-muted: #a1a1aa; /* zinc-400 */
                --color-border: #27272a;
                --color-shadow: rgba(0, 0, 0, 0.5);
            }

            body {
                background-color: var(--color-bg) !important;
                color: var(--color-text) !important;
                transition: background-color 0.3s, color 0.3s;
            }

            .glass-card {
                background: var(--color-card-bg) !important;
                backdrop-filter: blur(12px) !important;
                border: 1px solid var(--color-card-border) !important;
                color: var(--color-text) !important;
                box-shadow: 0 4px 20px -2px var(--color-shadow) !important;
                transition: background-color 0.3s, border-color 0.3s;
            }

            /* Override Tailwind text color classes */
            .text-white, .text-gray-100, .text-gray-200 {
                color: var(--color-text) !important;
            }
            .bg-gradient-to-tr.text-white,
            .bg-gradient-to-tr.text-white *,
            .bg-indigo-600.text-white,
            .bg-indigo-600.text-white *,
            .bg-purple-600.text-white,
            .bg-purple-600.text-white *,
            .bg-emerald-600.text-white,
            .bg-emerald-600.text-white *,
            button[type="submit"],
            button[type="submit"] * {
                color: #ffffff !important;
            }
            .text-gray-300, .text-gray-400 {
                color: var(--color-muted) !important;
            }
            .text-gray-500 {
                color: var(--color-muted) !important;
            }
            .text-gray-600 {
                color: var(--color-muted) !important;
            }
            
            /* Orange Accents */
            .text-indigo-400, .text-indigo-300, .text-purple-400, .text-purple-300, .text-indigo-500, .text-purple-500, .text-purple-600, .text-indigo-600 {
                color: var(--color-primary) !important;
            }
            .bg-indigo-600, .bg-purple-600, .bg-indigo-500, .bg-purple-500 {
                background-color: var(--color-primary) !important;
                color: #ffffff !important;
            }
            .hover\:bg-indigo-500:hover, .hover\:bg-purple-500:hover, .hover\:bg-indigo-600:hover, .hover\:bg-purple-600:hover {
                background-color: var(--color-primary-hover) !important;
            }
            .bg-indigo-600\/20, .bg-purple-600\/20, .bg-indigo-500\/10, .bg-purple-500\/10, .bg-purple-600\/10 {
                background-color: rgba(249, 115, 22, 0.15) !important;
            }
            .bg-purple-100, .bg-indigo-100 {
                background-color: rgba(249, 115, 22, 0.1) !important;
            }
            .border-purple-200, .border-indigo-200 {
                border-color: rgba(249, 115, 22, 0.3) !important;
            }
            
            /* Red / Cancel Buttons & Actions */
            .bg-red-600, .bg-red-500, .bg-rose-600, .bg-rose-500,
            button.bg-red-600, button.bg-red-500, button.bg-rose-600, button.bg-rose-500,
            .btn-cancel {
                background-color: #dc2626 !important;
                background-image: none !important;
                border-color: #dc2626 !important;
                color: #ffffff !important;
            }
            .bg-red-600 *, .bg-red-500 *, .bg-rose-600 *, .bg-rose-500 *,
            button.bg-red-600 *, button.bg-red-500 *, button.bg-rose-600 *, button.bg-rose-500 *,
            .btn-cancel * {
                color: #ffffff !important;
            }
            .hover\:bg-red-700:hover, .hover\:bg-red-600:hover, .hover\:bg-rose-700:hover, .hover\:bg-rose-600:hover,
            button.bg-red-600:hover, button.bg-rose-600:hover,
            .btn-cancel:hover {
                background-color: #b91c1c !important;
                border-color: #b91c1c !important;
                color: #ffffff !important;
            }
            
            /* Background colors for layout containers */
            .bg-gray-900, .bg-gray-950, .bg-gray-900\/40, .bg-gray-900\/60, .bg-gray-950\/60, .bg-gray-900\/50, .bg-slate-50, .bg-slate-100 {
                background-color: var(--color-card-bg) !important;
                color: var(--color-text) !important;
            }
            .border-gray-900, .border-gray-950, .border-gray-800, .border-gray-850, .border-slate-100, .border-slate-200 {
                border-color: var(--color-border) !important;
            }
            
            /* Target sidebar navigation and footer hovers directly */
            #sidebar-menu nav a:hover,
            #sidebar-menu .p-4 a:hover,
            #sidebar-menu .p-4 button:hover {
                background-color: var(--color-primary-hover) !important;
                color: #ffffff !important;
            }
            #sidebar-menu nav a:hover *,
            #sidebar-menu .p-4 a:hover *,
            #sidebar-menu .p-4 button:hover * {
                color: #ffffff !important;
            }

            /* Ensure branding logo never gets background highlight on hover */
            #sidebar-menu .border-b a,
            #sidebar-menu .border-b a:hover,
            #sidebar-menu .border-b a:hover *,
            a.brand-link,
            a.brand-link:hover,
            a.brand-link:hover * {
                background-color: transparent !important;
                background-image: none !important;
            }
            
            /* Forms, inputs, dropdowns */
            input, select, textarea {
                background-color: var(--color-input-bg) !important;
                border: 1px solid var(--color-input-border) !important;
                color: var(--color-text) !important;
            }
            input:focus, select:focus, textarea:focus {
                border-color: var(--color-primary) !important;
                box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2) !important;
                outline: none !important;
            }
            option {
                background-color: var(--color-input-bg) !important;
                color: var(--color-text) !important;
            }
            
            /* Alert styles overrides */
            .bg-emerald-950\/50, .bg-emerald-900\/30, .bg-emerald-100 {
                background-color: rgba(16, 185, 129, 0.15) !important;
                border-color: rgba(16, 185, 129, 0.4) !important;
                color: #10b981 !important;
            }
            .bg-rose-950\/50, .bg-rose-900\/30, .bg-rose-100 {
                background-color: rgba(239, 68, 68, 0.15) !important;
                border-color: rgba(239, 68, 68, 0.4) !important;
                color: #ef4444 !important;
            }
            .bg-indigo-950\/40, .bg-purple-50 {
                background-color: rgba(249, 115, 22, 0.15) !important;
                border-color: rgba(249, 115, 22, 0.4) !important;
                color: var(--color-primary) !important;
            }
            
            /* Table headers & cells */
            th {
                background-color: var(--color-input-border) !important;
                color: var(--color-text) !important;
            }
            td {
                border-bottom-color: var(--color-border) !important;
                color: var(--color-text) !important;
            }
            
            /* Radar & decorative shapes opacity */
            .opacity-10, .opacity-20 {
                opacity: 0.15 !important;
            }
            /* Hide radial background glow blobs/shapes entirely for pure solid background */
            .absolute.rounded-full.filter.blur-3xl,
            .blur-3xl {
                display: none !important;
            }

            /* Override backgrounds that are gradients to solid primary orange */
            .bg-gradient-to-r:not(.bg-clip-text), 
            .bg-gradient-to-tr:not(.bg-clip-text), 
            .bg-gradient-to-br:not(.bg-clip-text), 
            .bg-gradient-to-tl:not(.bg-clip-text),
            [class*="bg-gradient-"]:not(.bg-clip-text) {
                background-image: none !important;
                background-color: var(--color-primary) !important;
            }

            /* For text clip gradient elements, make them solid orange text with transparent background */
            .bg-clip-text, [class*="bg-clip-text"] {
                background-image: none !important;
                background-color: transparent !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
                -webkit-text-fill-color: var(--color-primary) !important;
                color: var(--color-primary) !important;
            }

            /* Text contrast overrides for light and dark modes */
            :root.dark .text-slate-900,
            :root.dark .text-slate-800,
            :root.dark .text-slate-700,
            :root.dark .text-gray-900,
            :root.dark .text-gray-800,
            :root.dark .text-gray-700,
            :root.dark h1,
            :root.dark h2,
            :root.dark h3,
            :root.dark h4,
            :root.dark h5,
            :root.dark h6 {
                color: #ffffff !important;
            }

            :root.dark .text-slate-500,
            :root.dark .text-slate-400,
            :root.dark .text-gray-500,
            :root.dark .text-gray-400,
            :root.dark p {
                color: #cbd5e1 !important;
            }

            :root.dark .text-slate-600,
            :root.dark .text-gray-600 {
                color: #94a3b8 !important;
            }

            :root:not(.dark) .text-slate-900,
            :root:not(.dark) .text-slate-800,
            :root:not(.dark) .text-slate-700,
            :root:not(.dark) .text-gray-900,
            :root:not(.dark) .text-gray-800,
            :root:not(.dark) .text-gray-700,
            :root:not(.dark) h1,
            :root:not(.dark) h2,
            :root:not(.dark) h3,
            :root:not(.dark) h4 {
                color: #0f172a !important;
            }

            :root:not(.dark) .text-slate-500,
            :root:not(.dark) .text-slate-400,
            :root:not(.dark) .text-gray-500,
            :root:not(.dark) .text-gray-400,
            :root:not(.dark) p {
                color: #334155 !important;
            }

            /* Make sure button/link texts on solid orange elements are white for readability */
            a.bg-gradient-to-r:not(.bg-clip-text),
            a.bg-gradient-to-tr:not(.bg-clip-text),
            button.bg-gradient-to-r:not(.bg-clip-text),
            button.bg-gradient-to-tr:not(.bg-clip-text),
            .bg-indigo-600, .bg-purple-600, .bg-indigo-500, .bg-purple-500,
            button[type="submit"] {
                color: #ffffff !important;
            }
            a.bg-gradient-to-r:not(.bg-clip-text) *,
            a.bg-gradient-to-tr:not(.bg-clip-text) *,
            button.bg-gradient-to-r:not(.bg-clip-text) *,
            button.bg-gradient-to-tr:not(.bg-clip-text) * {
                color: #ffffff !important;
            }

            /* White buttons and white background containers keep white bg and dark text */
            :root .bg-white:not(input):not(select):not(textarea),
            :root.dark .bg-white:not(input):not(select):not(textarea),
            :root .bg-white:not(input):not(select):not(textarea) *,
            :root.dark .bg-white:not(input):not(select):not(textarea) *,
            :root .bg-white.text-slate-700,
            :root.dark .bg-white.text-slate-700,
            :root .bg-white.text-slate-700 *,
            :root.dark .bg-white.text-slate-700 * {
                background-color: #ffffff !important;
                color: #0f172a !important;
            }

            /* Re-override inputs to respect their light/dark variable background */
            input, select, textarea,
            input.bg-white, select.bg-white, textarea.bg-white {
                background-color: var(--color-input-bg) !important;
                border: 1px solid var(--color-input-border) !important;
                color: var(--color-text) !important;
            }

            /* Force header / top navbars to solid orange with white text */
            header, 
            nav.glass-card {
                background-color: var(--color-primary) !important;
                background-image: none !important;
                border-color: var(--color-primary-hover) !important;
                color: #ffffff !important;
            }

            /* Ensure all links, text, and icons in orange navbar are white by default */
            header *, 
            nav.glass-card * {
                color: #ffffff !important;
            }

            /* Enforce white color for navbar text links (Sign In, Home, etc.), excluding buttons/dropdowns/primary bg buttons */
            header a:not(#avatar-dropdown a):not(.bg-white):not([class*="bg-purple"]):not([class*="bg-indigo"]),
            nav.glass-card a:not(#avatar-dropdown a):not(.bg-white):not([class*="bg-purple"]):not([class*="bg-indigo"]) {
                color: #ffffff !important;
            }
            header a:not(#avatar-dropdown a):not(.bg-white):not([class*="bg-purple"]):not([class*="bg-indigo"]) *,
            nav.glass-card a:not(#avatar-dropdown a):not(.bg-white):not([class*="bg-purple"]):not([class*="bg-indigo"]) * {
                color: #ffffff !important;
            }

            /* Logo image styling */
            header img,
            nav.glass-card img,
            #sidebar-menu img {
                background: transparent !important;
                border-radius: 0.5rem;
            }

            /* Turn logo text to white in orange navbar */
            header span.text-xl,
            nav.glass-card span.text-xl {
                color: #ffffff !important;
                -webkit-text-fill-color: #ffffff !important;
            }

            /* Buttons inside the orange navbar should be white with orange text */
            header .bg-purple-600,
            nav.glass-card .bg-purple-600,
            header .bg-indigo-600,
            nav.glass-card .bg-indigo-600,
            header a.bg-purple-600,
            nav.glass-card a.bg-purple-600,
            header a.bg-indigo-600,
            nav.glass-card a.bg-indigo-600,
            header button[type="submit"],
            nav.glass-card button[type="submit"] {
                background-color: #ffffff !important;
                color: var(--color-primary) !important;
            }
            header .bg-purple-600 *,
            nav.glass-card .bg-purple-600 *,
            header .bg-indigo-600 *,
            nav.glass-card .bg-indigo-600 *,
            header a.bg-purple-600 *,
            nav.glass-card a.bg-purple-600 *,
            header a.bg-indigo-600 *,
            nav.glass-card a.bg-indigo-600 * {
                color: var(--color-primary) !important;
            }

            /* Style Avatar rounded button in navbar */
            header .rounded-full,
            nav.glass-card .rounded-full {
                background-color: rgba(255, 255, 255, 0.25) !important;
                background-image: none !important;
                border: 2px solid #ffffff !important;
                color: #ffffff !important;
            }
            header .rounded-full *,
            nav.glass-card .rounded-full * {
                color: #ffffff !important;
            }

            /* Theme toggle button styling overrides inside orange navbars */
            header button[onclick="toggleTheme()"],
            nav.glass-card button[onclick="toggleTheme()"],
            header #theme-toggle-btn,
            nav.glass-card #theme-toggle-btn {
                background-color: #ffffff !important;
                background-image: none !important;
                border-color: #ffffff !important;
            }
            header button[onclick="toggleTheme()"] *,
            nav.glass-card button[onclick="toggleTheme()"] *,
            header #theme-toggle-icon,
            nav.glass-card #theme-toggle-icon {
                color: var(--color-primary) !important; /* Force solid orange logo on toggle icon */
            }

            /* Hide scrollbars globally */
            ::-webkit-scrollbar {
                display: none !important;
            }
            html, body {
                -ms-overflow-style: none !important;  /* IE and Edge */
                scrollbar-width: none !important;  /* Firefox */
            }

            /* Force solid orange color on the theme toggle sun/moon icon */
            #theme-toggle-icon,
            button[onclick="toggleTheme()"] i,
            button[onclick="toggleTheme()"] * {
                color: #f97316 !important;
                -webkit-text-fill-color: #f97316 !important;
            }

            .glow-btn:hover {
                box-shadow: 0 0 25px rgba(249, 115, 22, 0.4) !important;
            }
            .glow-hover:hover {
                box-shadow: 0 0 20px rgba(249, 115, 22, 0.4) !important;
            }
        </style>
        <script>
            // Inline theme initialization to prevent flash of unstyled content
            (function() {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
        </script>
    </th:block>

    <!-- Theme Scripts Fragment -->
    <th:block th:fragment="themeScripts">
        <script>
            function toggleTheme() {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            }

            function updateThemeIcons() {
                const isDark = document.documentElement.classList.contains('dark');
                const icons = document.querySelectorAll('#theme-toggle-icon');
                icons.forEach(icon => {
                    if (isDark) {
                        icon.className = 'fa-solid fa-sun text-amber-500';
                    } else {
                        icon.className = 'fa-solid fa-moon text-slate-500';
                    }
                });
            }

            // Set initially
            updateThemeIcons();
            document.addEventListener('DOMContentLoaded', updateThemeIcons);
        </script>
    </th:block>

</body>
</html>
