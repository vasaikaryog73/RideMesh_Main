<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMesh - Become a Driver</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar fragment injection -->
    <div th:replace="~{fragments/navigation :: sidebar('become-driver', ${currentUser})}"></div>

    <div class="flex-grow flex flex-col min-h-screen">
        <!-- Top Navbar fragment injection -->
        <header th:replace="~{fragments/navigation :: navbar(${currentUser})}"></header>

        <main class="flex-grow p-8 flex items-start justify-center relative overflow-hidden">
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600 rounded-full filter blur-3xl opacity-10 animate-pulse"></div>
            
            <div class="w-full max-w-2xl relative z-10 space-y-6">

                <!-- Alert Messages -->
                <div th:if="${errorMessage != null}" class="p-4 rounded-xl bg-rose-950/50 border border-rose-500/30 text-rose-400 text-sm text-center shadow-lg">
                    <span th:text="${errorMessage}">Error description</span>
                </div>
                <div th:if="${successMessage != null}" class="p-4 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 text-sm text-center shadow-lg">
                    <span th:text="${successMessage}">Success description</span>
                </div>

                <div class="glass-card p-8 rounded-2xl shadow-2xl space-y-6">
                    <div class="flex items-center space-x-4 border-b border-gray-950 pb-4">
                        <div class="w-10 h-10 rounded-lg bg-indigo-600/20 flex items-center justify-center text-indigo-400 text-lg"><i class="fa-solid fa-id-card"></i></div>
                        <div>
                            <h2 class="text-xl font-bold text-white">Apply to Become a Driver</h2>
                            <p class="text-xs text-gray-400">Submit your vehicle specifications and driving documents to apply.</p>
                        </div>
                    </div>

                    <form th:action="@{/rider/become-driver}" method="POST" enctype="multipart/form-data" onsubmit="return showNotImplementedModal(event)" class="space-y-6">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Vehicle Model & Manufacturer</label>
                            <input type="text" name="vehicleModel" required placeholder="e.g. Toyota Prius 2022"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Vehicle Numeric ID / Code</label>
                            <input type="text" name="vehicleId" required placeholder="e.g. 98112"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Vehicle Type</label>
                            <select name="vehicleType" required class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                                <option value="">Select vehicle type...</option>
                                <option value="car">Car</option>
                                <option value="6 seater van">6 Seater Van</option>
                                <option value="8 seater van">8 Seater Van</option>
                                <option value="bike">Bike</option>
                                <option value="scooter">Scooter</option>
                                <option value="rickshaw">Rickshaw</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Phone Number</label>
                            <input type="tel" name="phoneNumber" required placeholder="e.g. +919876543210"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">State</label>
                                <select id="state-select" name="state" required
                                        class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                                    <option value="">Select State...</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Delhi">Delhi</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">District</label>
                                <select id="district-select" name="district" required
                                        class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                                    <option value="">Select District...</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Driver License Number</label>
                            <input type="text" name="licenseNumber" required placeholder="e.g. DL-981122-MH"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Vehicle Photos (PNG/JPG/JPEG, Multiple allowed)</label>
                            <input type="file" id="vehicle-photos-input" name="vehiclePhotos" required multiple accept="image/png, image/jpeg, image/jpg"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3 text-white text-sm focus:outline-none transition file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                            <div id="vehicle-photos-preview" class="grid grid-cols-3 md:grid-cols-4 gap-3 mt-2"></div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Driver's License Document (PNG/JPG/JPEG)</label>
                            <input type="file" id="license-photo-input" name="licensePhoto" required accept="image/png, image/jpeg, image/jpg"
                                   class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3 text-white text-sm focus:outline-none transition file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                            <div id="license-photo-preview" class="mt-2 hidden">
                                <img src="" alt="License Preview" class="max-h-32 rounded-lg border border-gray-800 object-cover shadow">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Identity Document Type</label>
                                <select name="identityDocType" required
                                        class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3.5 text-white text-sm focus:outline-none transition">
                                    <option value="Aadhar Card">Aadhar Card</option>
                                    <option value="PAN Card">PAN Card</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Proof of Identity (PNG/JPG/JPEG)</label>
                                <input type="file" id="identity-photo-input" name="identityPhoto" required accept="image/png, image/jpeg, image/jpg"
                                       class="w-full bg-gray-950/60 border border-gray-900 focus:border-indigo-500 rounded-lg p-3 text-white text-sm focus:outline-none transition file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                                <div id="identity-photo-preview" class="mt-2 hidden">
                                    <img src="" alt="Identity Preview" class="max-h-32 rounded-lg border border-gray-800 object-cover shadow">
                                </div>
                            </div>
                        </div>

                        <button type="submit"
                                class="w-full py-3.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg">
                            Request to become a Driver
                        </button>
                    </form>
                </div>

            </div>
        </main>

        <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-950">
            &copy; 2026 RideMesh Systems Inc. All rights reserved.
        </footer>
    </div>

    <!-- Script triggers -->
    <div th:replace="~{fragments/navigation :: navigationScripts}"></div>

    <script>
        let stateDistrictsMap = {};

        const stateSelect = document.getElementById('state-select');
        const districtSelect = document.getElementById('district-select');

        // Fetch all states and districts dynamically from GitHub raw JSON file
        fetch('https://raw.githubusercontent.com/sab99r/Indian-States-And-Districts/master/states-and-districts.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.states) {
                    stateSelect.innerHTML = '<option value="">Select State...</option>';
                    data.states.forEach(item => {
                        stateDistrictsMap[item.state] = item.districts;
                        const option = document.createElement('option');
                        option.value = item.state;
                        option.textContent = item.state;
                        stateSelect.appendChild(option);
                    });
                }
            })
            .catch(err => {
                console.error("Failed to fetch states/districts API:", err);
                // Fallback to local subset if fetch fails
                stateDistrictsMap = {
                    "Maharashtra": ["Mumbai", "Thane", "Palghar", "Pune", "Nashik"],
                    "Karnataka": ["Bengaluru Urban", "Bengaluru Rural", "Kolar", "Tumakuru"],
                    "Delhi": ["New Delhi", "South Delhi", "Central Delhi"]
                };
                stateSelect.innerHTML = '<option value="">Select State...</option>';
                Object.keys(stateDistrictsMap).forEach(state => {
                    const option = document.createElement('option');
                    option.value = state;
                    option.textContent = state;
                    stateSelect.appendChild(option);
                });
            });

        stateSelect.addEventListener('change', function() {
            const selectedState = stateSelect.value;
            districtSelect.innerHTML = '<option value="">Select District...</option>';
            
            if (selectedState && stateDistrictsMap[selectedState]) {
                stateDistrictsMap[selectedState].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
        });

        // 3. Dynamic image preview controllers
        function setupSingleImagePreview(inputId, previewContainerId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(previewContainerId);
            const img = container.querySelector('img');

            input.addEventListener('change', function() {
                const file = input.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        img.src = e.target.result;
                        container.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                } else {
                    container.classList.add('hidden');
                }
            });
        }

        setupSingleImagePreview('license-photo-input', 'license-photo-preview');
        setupSingleImagePreview('identity-photo-input', 'identity-photo-preview');

        // Multi-image preview for vehicle photos
        const vehicleInput = document.getElementById('vehicle-photos-input');
        const vehiclePreview = document.getElementById('vehicle-photos-preview');

        vehicleInput.addEventListener('change', function() {
            vehiclePreview.innerHTML = '';
            const files = Array.from(vehicleInput.files);
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'relative border border-gray-800 rounded-lg overflow-hidden shadow';
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-24 object-cover';
                    
                    imgDiv.appendChild(img);
                    vehiclePreview.appendChild(imgDiv);
                };
                reader.readAsDataURL(file);
            });
        });
    </script>
</body>
</html>
